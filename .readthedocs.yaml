version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      # Installs the package (built from source with Meson) for autodoc.
      - python -m pip install --upgrade pip
      - python -m pip install --group docs .

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

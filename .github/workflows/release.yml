name: Release

# Pushing a tag vX.Y.Z builds the sdist and wheels and publishes them to PyPI
# via trusted publishing (SPEC 8). Running this workflow by hand rehearses a
# release: it builds everything and publishes to TestPyPI instead.
#
# One-time setup: register this workflow as a trusted publisher on PyPI
# (environment "pypi") and TestPyPI (environment "testpypi"), and create both
# environments in the repository settings; give "pypi" required reviewers.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  check-version:
    name: Check versions match
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.81.0
          run-install: false
      - name: Compare meson.build, CITATION.cff and (on tag pushes) the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(pixi exec meson introspect --projectinfo meson.build | jq -r .version)
          citation=$(sed -n 's/^version: *//p' CITATION.cff)
          echo "event=$GITHUB_EVENT_NAME ref=$TAG meson.build=$version CITATION.cff=$citation"
          test "$citation" = "$version"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$TAG" = "v$version"
          fi

  build:
    needs: check-version
    uses: ./.github/workflows/wheels.yml
    permissions:
      contents: read

  publish-testpypi:
    name: Publish to TestPyPI (rehearsal)
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/quickbeam/
    permissions:
      id-token: write # trusted publishing and PEP 740 attestations
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      # skip-existing: TestPyPI keeps the first upload of a version, so later
      # rehearsals of the same version still exercise the build and the login.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/quickbeam/
    permissions:
      id-token: write # trusted publishing and PEP 740 attestations
      attestations: write # GitHub build provenance
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # Uploads PEP 740 attestations to PyPI by default.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

name: Update pixi lockfile

# Dependabot does not update pixi.lock, so this opens a monthly PR instead.
# PRs opened with GITHUB_TOKEN do not trigger CI: close and reopen the PR (or
# push to it) to run the checks before merging.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
      - name: Update lockfile
        run: |
          set -o pipefail
          pixi update --json | pixi exec pixi-diff-to-markdown > diff.md
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update-pixi-lock
          commit-message: "build: update pixi.lock"
          title: "build: update pixi.lock"
          body-path: diff.md
          add-paths: pixi.lock
          delete-branch: true
          labels: dependencies

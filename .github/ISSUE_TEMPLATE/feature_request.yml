name: Feature request
description: Suggest a new measurement, counter, platform or API.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out?
      description: The performance question you cannot answer with Quickbeam today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or workarounds, and why they fall short.
